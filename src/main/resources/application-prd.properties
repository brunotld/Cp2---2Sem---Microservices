spring.application.name=cinema-api
server.port=8080

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Database (profile prd - producao)
# Todas as variaveis sao obrigatorias (sem valor default) e devem ser
# fornecidas na execucao do container.
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL}:${DB_SERVER_PORT}/${DB_SCHEMA}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PWD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# IMPORTANTE: no profile prd o banco de dados e as tabelas NAO podem ser
# criados automaticamente pela aplicacao. Por isso ddl-auto=none.
# As tabelas devem ser criadas previamente (ver database/schema.sql).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

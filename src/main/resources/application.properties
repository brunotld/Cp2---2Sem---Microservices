spring.application.name=cinema-api
server.port=8080

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Database (profile default - desenvolvimento local)
# Os valores apos ':' sao os defaults usados quando a variavel de ambiente nao e informada.
spring.datasource.url=jdbc:mysql://${DB_SERVER_URL:localhost}:${DB_SERVER_PORT:3306}/${DB_SCHEMA:cinema_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PWD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# No profile default a aplicacao PODE criar o banco/tabelas automaticamente (facilita o desenvolvimento).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
